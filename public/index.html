<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הספריה שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>הספריה שלי</h1>
        <p id="stats" class="stats"></p>
      </div>
      <div class="top-actions">
        <button id="btn-logout" class="link" hidden>יציאה</button>
        <button id="btn-categories" class="btn ghost">קטגוריות</button>
        <button id="btn-import" class="btn ghost">הוספה מרוכזת</button>
        <button id="btn-add" class="btn primary">+ ספר חדש</button>
      </div>
    </div>
  </header>

  <main>
    <section class="filters">
      <input id="search" type="search" placeholder="חיפוש לפי שם ספר או שם סופר…" autocomplete="off">
      <div class="filter-row">
        <div class="segmented" id="status" role="group" aria-label="מצב">
          <button data-status="" class="on">הכול</button>
          <button data-status="available">על המדף</button>
          <button data-status="loaned">מושאלים</button>
        </div>
        <select id="f-author" aria-label="סופר"></select>
        <select id="f-age" aria-label="גיל מומלץ"></select>
        <button id="clear" class="link" hidden>ניקוי סינון</button>
      </div>
      <div id="chips" class="chips" role="group" aria-label="קטגוריות"></div>
    </section>

    <p id="count" class="count"></p>
    <div id="list" class="list"></div>
  </main>

  <!-- ספר: הוספה / עריכה -->
  <dialog id="dlg-book">
    <form id="form-book" method="dialog">
      <h2 id="book-heading">ספר חדש</h2>
      <label>שם הספר
        <input name="title" required maxlength="200">
      </label>
      <label>שם הסופר
        <input name="author" maxlength="200" list="authors-list">
      </label>
      <div class="two">
        <label>קטגוריה
          <select name="categoryId"></select>
        </label>
        <label>גיל מומלץ
          <select name="ageGroup"></select>
        </label>
      </div>
      <label>הערות
        <textarea name="notes" rows="2" maxlength="1000"></textarea>
      </label>
      <div id="history" class="history" hidden></div>
      <p class="error" id="book-error"></p>
      <div class="dlg-actions">
        <button type="submit" class="btn primary">שמירה</button>
        <button type="button" class="btn ghost" data-close>ביטול</button>
        <span class="spacer"></span>
        <button type="button" class="btn danger" id="book-delete" hidden>מחיקת הספר</button>
      </div>
    </form>
  </dialog>

  <!-- השאלה -->
  <dialog id="dlg-loan">
    <form id="form-loan" method="dialog">
      <h2>השאלת ספר</h2>
      <p id="loan-book" class="dlg-sub"></p>
      <label>שם המשאילה
        <input name="borrower" required maxlength="100" list="borrowers-list" autocomplete="off">
      </label>
      <label>תאריך ההשאלה
        <input name="date" type="date" required>
      </label>
      <p class="error" id="loan-error"></p>
      <div class="dlg-actions">
        <button type="submit" class="btn primary">רישום השאלה</button>
        <button type="button" class="btn ghost" data-close>ביטול</button>
      </div>
    </form>
  </dialog>

  <!-- קטגוריות -->
  <dialog id="dlg-categories">
    <div class="dlg-body">
      <h2>ניהול קטגוריות</h2>
      <ul id="cat-list" class="cat-list"></ul>
      <form id="form-cat" class="cat-add">
        <input name="name" placeholder="קטגוריה חדשה" required maxlength="60" aria-label="קטגוריה חדשה">
        <button class="btn primary">הוספה</button>
      </form>
      <p class="error" id="cat-error"></p>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" data-close>סגירה</button>
      </div>
    </div>
  </dialog>

  <!-- הוספה מרוכזת -->
  <dialog id="dlg-import">
    <form id="form-import" method="dialog">
      <h2>הוספה מרוכזת</h2>
      <p class="dlg-sub">ספר בכל שורה, בתבנית:<br><code>שם הספר | סופר | קטגוריה | גיל מומלץ</code><br>רק שם הספר חובה. אפשר גם להדביק ישירות מאקסל.</p>
      <textarea name="text" rows="10" required></textarea>
      <p class="error" id="import-error"></p>
      <div class="dlg-actions">
        <button type="submit" class="btn primary">הוספה</button>
        <button type="button" class="btn ghost" data-close>ביטול</button>
      </div>
    </form>
  </dialog>

  <!-- כניסה -->
  <dialog id="dlg-login">
    <form id="form-login" method="dialog">
      <h2>הספריה שלי</h2>
      <label>סיסמה
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p class="error" id="login-error"></p>
      <div class="dlg-actions">
        <button type="submit" class="btn primary">כניסה</button>
      </div>
    </form>
  </dialog>

  <datalist id="authors-list"></datalist>
  <datalist id="borrowers-list"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
